name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble library and sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # JDK 17 runs the Robolectric tests in the sample module, JDK 21 runs Gradle.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      # The action installs the retired "tools" package by default, which makes sdkmanager fail.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble release library and debug sample
        run: ./gradlew :assembleRelease :sample:assembleDebug --stacktrace

      - name: Run unit and UI tests
        run: ./gradlew :test :sample:testDebugUnitTest --stacktrace
